name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          python3 -m py_compile AIReply.popclipext/lib/*.py
          python3 -m py_compile AIReply.popclipext/tests/*.py

      - name: Shell syntax check
        run: |
          for f in AIReply.popclipext/reply.zsh \
                   AIReply.popclipext/models.zsh \
                   AIReply.popclipext/lib/dialog.zsh; do
            echo "Checking $f ..."
            zsh -n "$f"
          done

      - name: Run tests
        working-directory: AIReply.popclipext
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v